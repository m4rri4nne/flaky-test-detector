name: Flaky Test Report

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # read workflow runs / artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze
        run: |
          # analyze exits 1 when flaky tests are found; that must not stop the report
          python -m flaky_detector analyze             --repo "${{ github.repository }}"             --last-runs 50 --threshold 0.1             --output-dir reports || [ $? -eq 1 ]
          cat reports/flaky-report-*.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: flaky-report
          path: reports/
