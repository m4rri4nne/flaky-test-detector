<text x="340.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Analyze, trend, commit history.db</text>
<line x1="418" y1="248" x2="418" y2="288" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="262" y1="248" x2="262" y2="288" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="40" y="198" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<text x="62" y="205" dominant-baseline="central" font-size="12" fill="#444441">Core analysis</text>
<rect x="40" y="224" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="62" y="231" dominant-baseline="central" font-size="12" fill="#444441">Optional history</text>
</svg>
