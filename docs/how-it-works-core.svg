<svg xmlns="http://www.w3.org/2000/svg" width="680" height="286" viewBox="0 0 680 286" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>flaky-test-detector core flow</title>
<desc>JUnit XML files or GitHub Actions artifacts are parsed, scored per test and commit, and ranked. The ranking prints a console list and exits with code 1 if flaky tests are found. </desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="285" rx="12" fill="#FFFFFF" stroke="#D3D1C7"/>
<rect x="40" y="40" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="106.0" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Local files</text>
<text x="106.0" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">results/*.xml</text>
<rect x="40" y="112" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="106.0" y="130" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">GitHub Actions</text>
<text x="106.0" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Run artifacts</text>
<rect x="196" y="76" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="262.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Parse</text>
<text x="262.0" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">JUnit XML</text>
<rect x="352" y="76" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="418.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Score</text>
<text x="418.0" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Per test/commit</text>
<rect x="508" y="76" width="132" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="574.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Rank</text>
<text x="574.0" y="112" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Worst first</text>
<line x1="173" y1="68" x2="194" y2="92" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="173" y1="140" x2="194" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="104" x2="350" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="486" y1="104" x2="506" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="508" y="190" width="132" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="574.0" y="208" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Console list</text>
<text x="574.0" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Exit 1 if flaky</text>
<line x1="574" y1="134" x2="574" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
