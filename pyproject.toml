[project]
name = "flaky-test-detector"
version = "0.1.0"
description = "Finds flaky tests from CI history (JUnit XML / GitHub Actions)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pip>=24",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flaky_detector"]
